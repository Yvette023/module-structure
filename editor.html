<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装修编辑页 · 模块结构</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/mod1.css">
<link rel="stylesheet" href="assets/css/mod2.css">
<link rel="stylesheet" href="assets/css/mod3.css">
<link rel="stylesheet" href="assets/css/mod4.css">
<link rel="stylesheet" href="assets/css/mod5.css?v=5">
<link rel="stylesheet" href="assets/css/editor-shell.css?v=5">
<link rel="stylesheet" href="assets/css/editor-canvas.css?v=5">
</head>
<body class="ed">

<!-- ================= 顶部工具条 ================= -->
<header class="ed-top">
  <div class="ed-top__group">
    <a class="ed-ibtn" href="index.html" title="返回" data-icon="arrow" style="--rot:180deg"></a>
    <button class="ed-ibtn is-on" title="页面" data-icon="grid"></button>
    <button class="ed-ibtn" title="组件" data-icon="cube"></button>
    <button class="ed-ibtn" title="结构" data-icon="handshake"></button>
    <button class="ed-ibtn" title="设置" data-icon="brush"></button>
  </div>

  <div class="ed-top__mid">
    <button class="ed-pill" title="设备">
      <span class="ed-pill__ic" data-icon="monitor"></span>
      <span class="ed-pill__txt">PC</span>
      <span class="ed-pill__chev" data-icon="chevron"></span>
    </button>
    <span class="ed-divider"></span>
    <button class="ed-pill" title="页面">
      <span class="ed-pill__ic" data-icon="store"></span>
      <span class="ed-pill__txt">Home</span>
      <span class="ed-pill__chev" data-icon="chevron"></span>
    </button>
    <span class="ed-divider"></span>
    <button class="ed-ibtn is-on" title="当前页面" data-icon="image"></button>
    <label class="ed-modpick">
      <span class="ed-modpick__label">模块</span>
      <span class="ed-modpick__sel">
        <select id="structureSel"></select>
        <span class="ed-modpick__chev" data-icon="chevron"></span>
      </span>
    </label>
  </div>

  <div class="ed-top__right">
    <span class="ed-avatar" title="liyuaner"></span>
    <button class="ed-save" id="saveBtn">保存</button>
  </div>
</header>

<!-- ================= 画布 + 设置面板 ================= -->
<main class="ed-main">
  <div class="ed-canvas">
    <div class="ed-stage is-center" id="stage">
      <div id="canvas" style="width:100%"></div>
    </div>
  </div>

  <aside class="ed-panel">
    <div class="ed-panel__head">
      <span class="ed-panel__title">列</span>
      <span class="ed-panel__actions">
        <button class="ed-ibtn" id="resetBtn" title="重置当前模块" data-icon="refresh"></button>
        <button class="ed-ibtn" id="closeBtn" title="收起面板" data-icon="eyeOff"></button>
      </span>
    </div>
    <div id="panel" style="display:flex;flex-direction:column;min-height:0;flex:1"></div>
  </aside>
</main>

<!-- 主图弹层：图库 / 外链，详细设置收纳在这里，面板只留摘要 -->
<div class="ed-modal" id="heroModal" aria-hidden="true">
  <div class="ed-modal__mask" data-act="hero-close"></div>
  <div class="ed-modal__card" role="dialog" aria-label="更换主图">
    <header class="ed-modal__head">
      <b>更换主图</b>
      <button class="ed-ibtn" data-act="hero-close" title="关闭" style="font-size:17px;line-height:1">×</button>
    </header>
    <div class="ed-modal__body">
      <div class="ed-modal__label">图库</div>
      <div class="hero-gallery" id="heroGallery"></div>
      <div class="ed-modal__label">外链地址</div>
      <div class="hero-link">
        <input id="heroUrlInput" class="finput" placeholder="https:// 图片地址">
        <button class="ed-save" data-act="hero-url">使用</button>
      </div>
    </div>
  </div>
</div>

<button class="ed-fab" id="fabBtn">设置</button>
<div class="ed-toast" id="toast"></div>

<script src="assets/js/icons.js?v=5"></script>
<script src="assets/js/data.js?v=5"></script>
<script src="assets/js/editor-defs.js?v=5"></script>
<script src="assets/js/editor-fields.js?v=5"></script>
<script src="assets/js/editor-panels.js?v=5"></script>
<script src="assets/js/editor-m1.js?v=5"></script>
<script src="assets/js/editor-m5.js?v=5"></script>
<script src="assets/js/editor-canvas.js?v=5"></script>
<script src="assets/js/editor-core.js?v=5"></script>
</body>
</html>
